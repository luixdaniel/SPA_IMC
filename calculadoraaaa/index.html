<!DOCTYPE html>
<html>
<head>
    <title>Calculadora de IMC</title>
</head>
<body>
    <h2>Calculadora de Índice de Masa Corporal (IMC)</h2>
    <label for="peso">Peso (kg):</label>
    <input type="number" id="peso" placeholder="Ingrese su peso"><br><br>
    <label for="altura">Altura (m):</label>
    <input type="number" id="altura" placeholder="Ingrese su altura"><br><br>
    <button onclick="calcularIMC()">Calcular IMC</button>
    <h3>Resultado:</h3>
    <p id="resultado"></p>

    <script>
        function calcularIMC() {
            var peso = parseFloat(document.getElementById("peso").value);
            var altura = parseFloat(document.getElementById("altura").value);
            if (isNaN(peso) || isNaN(altura) || peso <= 0 || altura <= 0) {
                document.getElementById("resultado").innerHTML = "Por favor, ingrese valores válidos para peso y altura.";
                return;
            }
            var imc = peso / (altura * altura);
            var resultado = "Su IMC es: " + imc.toFixed(2) + "<br>";
            if (imc < 18.5) {
                resultado += "Clasificación: Peso inferior al normal";
            } else if (imc >= 18.5 && imc <= 24.9) {
                resultado += "Clasificación: Peso normal";
            } else if (imc >= 25 && imc <= 29.9) {
                resultado += "Clasificación: Peso superior al normal";
            } else {
                resultado += "Clasificación: Obesidad";
            }
            document.getElementById("resultado").innerHTML = resultado;
        }
    </script>
</body>
</html>
